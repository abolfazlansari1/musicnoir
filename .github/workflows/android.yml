name: Android APK
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build APK
        run: gradle --no-daemon assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noir-Music
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Noir-Music.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Noir-Music.apk --title "Noir Music (latest build)" --notes "APK built from commit ${GITHUB_SHA}. Signed with a fixed key, so it installs over the previous version." --target "${GITHUB_SHA}"
