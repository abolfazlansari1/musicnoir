name: UI check (emulator screenshots)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Make test media
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          bash ci/make_media.sh
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ci/drive.sh
      - name: Publish screenshots to branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r shots/* /tmp/out/ 2>/dev/null || true
          git config user.name ci && git config user.email ci@example.com
          git checkout --orphan ci-shots
          git rm -rf . >/dev/null 2>&1 || true
          cp -r /tmp/out/* . 2>/dev/null || true
          git add -A && git commit -q -m "screenshots for ${GITHUB_SHA}" || true
          git push -f origin ci-shots
